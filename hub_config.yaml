# 自建 SkillHub 后端地址
skillhub:
  base_url: "https://27.56.14.79:18081/api/skill-hub"

  # 认证方式（两种选一种）:
  # 1. 本地开发模式（password 为空）:
  #    使用 X-Mock-User-Id 头，username 为 mock 用户 ID
  #    可选值: local-admin（超级管理员）, local-user（普通用户）
  # 2. 生产模式（password 不为空）:
  #    先调用 /api/v1/auth/direct/login 获取 session
  username: "admin"
  password: "Admin@staging2026"

  # 上传技能的默认配置
  upload:
    namespace: "global"
    visibility: "PUBLIC"       # PUBLIC | PRIVATE

# Hub API Server 自身配置
server:
  host: "127.0.0.1"
  port: 8642
